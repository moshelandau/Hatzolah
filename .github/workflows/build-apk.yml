name: Build APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Verify resources exist
        run: |
          echo "=== Checking mipmap resources ==="
          find app/src/main/res/mipmap-* -type f -ls
          echo "=== Checking all res files ==="
          find app/src/main/res -type f | sort
          echo "=== PNG validation ==="
          file app/src/main/res/mipmap-*/ic_launcher.png || true

      - name: Setup Gradle wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hatzolah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Debug failure
        if: failure()
        run: |
          echo "=== Compiled resources ==="
          find app/build -name "*.flat" -ls 2>/dev/null | head -20
          echo "=== Resource errors ==="
          find app/build -name "aapt2-*" -exec cat {} \; 2>/dev/null | tail -30
          find app/build -name "*.log" -exec tail -20 {} \; 2>/dev/null
