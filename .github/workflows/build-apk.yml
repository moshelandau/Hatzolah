name: Build APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hatzolah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            build-output.txt
            app/build/reports/

      - name: Show failure details
        if: failure()
        run: |
          echo "=== Last 100 lines of build output ==="
          tail -100 build-output.txt 2>/dev/null || true
          echo "=== Errors ==="
          grep -A5 "error:" build-output.txt 2>/dev/null | head -50 || echo "No error: patterns found"
