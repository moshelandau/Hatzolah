name: Build APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hatzolah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Debug failure
        if: failure()
        run: |
          echo "=== Compiled resources ==="
          find app/build -name "*.flat" -ls 2>/dev/null | head -20
          echo "=== Resource errors ==="
          find app/build -name "aapt2-*" -exec cat {} \; 2>/dev/null | tail -30
          find app/build -name "*.log" -exec tail -20 {} \; 2>/dev/null
