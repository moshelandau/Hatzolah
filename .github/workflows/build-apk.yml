name: Build APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hatzolah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Show error details
        if: failure()
        run: |
          echo "=== Build failed. Checking for common issues ==="
          find app/build -name "*.log" -exec cat {} \; 2>/dev/null | tail -50
          find app/build/reports -type f -exec cat {} \; 2>/dev/null | tail -50
