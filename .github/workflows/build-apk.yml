name: Build APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build-output.txt || true

      - name: Check build result
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo 'APK built successfully!'
          else
            echo 'Build failed. Errors:'
            grep '^e:' build-output.txt || tail -20 build-output.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hatzolah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit error log on failure
        if: failure()
        run: |
          echo '=== KOTLIN ERRORS ===' > build-error-log.txt
          grep '^e:' build-output.txt >> build-error-log.txt 2>/dev/null || echo 'No e: lines' >> build-error-log.txt
          echo '' >> build-error-log.txt
          echo '=== LAST 30 LINES ===' >> build-error-log.txt
          tail -30 build-output.txt >> build-error-log.txt
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add -f build-error-log.txt
          git commit -m 'CI: build error log [skip ci]' || true
          git push || true
