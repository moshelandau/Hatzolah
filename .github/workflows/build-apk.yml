name: Build APK

on:
  push:
    branches: ['*']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        id: build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > build-output.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          echo '## Build Output (last 80 lines)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 build-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo 'apk_exists=true' >> $GITHUB_OUTPUT
          else
            echo 'apk_exists=false' >> $GITHUB_OUTPUT
          fi

      - name: Commit build log to repo
        if: always()
        run: |
          tail -100 build-output.txt > build-error-log.txt 2>/dev/null || echo 'No output' > build-error-log.txt
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add build-error-log.txt
          git commit -m 'CI: build error log [skip ci]' || true
          git push || true

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.apk_exists == 'true'
        with:
          name: hatzolah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Fail if no APK
        if: steps.build.outputs.apk_exists != 'true'
        run: |
          echo 'Build failed - no APK produced'
          tail -30 build-output.txt
          exit 1
